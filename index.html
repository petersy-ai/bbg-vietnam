<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Basic Bitch">
<title>Basic Bitch Guide to Vietnam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-inner" autocomplete="off">
    <div class="lock-mark" aria-hidden="true">bb.</div>
    <h1>Basic Bitch Guide to Vietnam</h1>
    <p class="lock-sub">Fourteen days, zero pork, maximum vibes.</p>
    <label for="pass" class="sr">Passphrase</label>
    <input id="pass" type="password" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button type="submit" class="btn-primary" id="unlockBtn">Unlock</button>
    <p class="lock-err" id="lockErr" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <main id="view" class="view"></main>
  <div id="mapView" class="mapview" hidden>
    <div id="map" class="map" aria-label="Map"></div>
    <div class="map-top">
      <div class="chips" id="mapChips" role="group" aria-label="Show on map"></div>
    </div>
    <section class="sheet" id="sheet" data-detent="peek" aria-label="Places list">
      <div class="sheet-grab" id="sheetGrab"><span></span></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <button class="fab" id="helpBtn" type="button" aria-label="Help me">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg>
  </button>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="now" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg><span>Now</span></button>
    <button type="button" data-tab="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></svg><span>Map</span></button>
    <button type="button" data-tab="trip"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Trip</span></button>
  </nav>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-scrim" data-close></div>
  <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet-grab"><span></span></div>
    <button type="button" class="modal-x" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
    <div id="modalBody"></div>
  </section>
</div>

<div id="poster" class="poster" hidden role="dialog" aria-modal="true" aria-label="Show this screen"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
